<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090c14"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Glowing IoT Waves -->
  <path d="M 180 140 A 100 100 0 0 1 332 140" fill="none" stroke="#4f46e5" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
  <path d="M 216 170 A 55 55 0 0 1 296 170" fill="none" stroke="#06b6d4" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
  <circle cx="256" cy="195" r="10" fill="#06b6d4" filter="url(#glow)"/>

  <!-- Smart Home Roof & Walls -->
  <path d="M 112 250 L 256 140 L 400 250 L 360 250 L 360 410 C 360 422 350 432 338 432 L 174 432 C 162 432 152 422 152 410 L 152 250 Z" fill="url(#wallGrad)" stroke="url(#roofGrad)" stroke-width="12" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Modern Smart Portal Door -->
  <rect x="220" y="310" width="72" height="122" rx="16" fill="#0b1120" stroke="rgba(99, 102, 241, 0.4)" stroke-width="4"/>
  <circle cx="256" cy="350" r="16" fill="url(#coreGrad)" filter="url(#glow)"/>
  <circle cx="256" cy="350" r="6" fill="#ffffff"/>

  <!-- Tech Windows -->
  <rect x="176" y="270" width="36" height="36" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="3" opacity="0.9"/>
  <rect x="300" y="270" width="36" height="36" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="3" opacity="0.9"/>
</svg>
